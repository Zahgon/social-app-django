[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=78.0.2"]

[dependency-groups]
dev = [
  "coverage>=3.6",
  "mypy==2.3.0",
  "pre-commit",
  "pyright==1.1.411",
  "pytest",
  "tox"
]

[project]
authors = [
  {email = "matiasaguirre@gmail.com", name = "Matias Aguirre"},
  {email = "michal@weblate.org", name = "Michal Čihař"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python",
  "Topic :: Internet"
]
dependencies = [
  "Flask>=3.0",
  "SQLAlchemy>=2.0",
  "blinker",
  "social-auth-core>=5.0.0,<6.0.0"
]
description = "Python Social Authentication, Flask integration."
keywords = ["flask", "oauth", "openid", "saml", "social auth"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
name = "social-auth-app-flask"
readme = "README.md"
requires-python = ">=3.10"
version = "6.0.1"

[project.optional-dependencies]
# This is present until pip implements supports for PEP 735
# see https://github.com/pypa/pip/issues/12963
dev = [
  "coverage>=3.6",
  "mypy==2.3.0",
  "pre-commit",
  "pyright==1.1.411",
  "pytest",
  "tox"
]

[project.urls]
Changelog = "https://github.com/python-social-auth/social-app-flask/blob/master/CHANGELOG.md"
Funding = "https://opencollective.com/python-social-auth"
Homepage = "https://github.com/python-social-auth/social-app-flask"

[tool.check-manifest]
ignore = [
  ".coveragerc",
  ".pre-commit-config.yaml",
  ".well-known/funding-manifest-urls",
  "tox.ini"
]

[tool.mypy]
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.10"
reportAttributeAccessIssue = "none"
reportOptionalMemberAccess = "none"
reportPossiblyUnboundVariable = "none"

[tool.ruff]
# Ignore some well known paths
exclude = [
  "*.egg",
  ".tox",
  ".venv",
  "build",
  "db/env.py",
  "db/versions/*.py",
  "dist",
  "doc",
  "site"
]
line-length = 120

[tool.ruff.lint]
ignore = [
  "ANN",  # TODO: Missing type annotations
  "ARG001",  # TODO: Unused function argument (mostly for API compatibility)
  "ARG002",  # TODO: Unused method argument (mostly for API compatibility)
  "B026",  # TODO: Star-arg unpacking after a keyword argument is strongly discouraged
  "COM812",  # CONFIG: incompatible with formatter
  "CPY001",  # TODO: Copyright not documented
  "D",  # TODO: Missing documentation
  "D203",  # CONFIG: incompatible with D211
  "D212",  # CONFIG: incompatible with D213
  "FBT002",  # TODO: Boolean default positional argument in function definition
  "FBT003",  # TODO: Boolean positional value in function call
  "RUF012"  # TODO: ClassVar type annotations
]
select = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.setuptools]
packages = ["social_flask"]

[tool.setuptools.package-data]
social_flask = ["py.typed", "templates/social_flask/*.html"]

[tool.tomlsort]
ignore_case = true
sort_inline_arrays = true
sort_inline_tables = true
sort_table_keys = true
spaces_before_inline_comment = 2
